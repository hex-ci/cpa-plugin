# Multi-arch CPA plugin build & release (WorkBuddy + QoderWork + QwenWork + TraeWork).
# Each plugin versions INDEPENDENTLY:
#   - tag '<id>-v*'       → release that plugin at that version
#   - workflow_dispatch   → pick plugin + version manually
#   - plain push/PR       → CI builds for all (artifacts only, no release)
#
# Install type is `direct` (registry schema_version 2): the release job pins an
# explicit URL + sha256 per platform into registry.json. `github-release` cannot
# be used here because the store resolves it through the repo-wide
# /releases/latest, which cannot distinguish the plugins sharing this monorepo.
#
# Asset naming matches CLIProxyAPI pluginstore ArchiveName():
#   <id>_<version>_<goos>_<goarch>.zip   (zip root: <id>.so|.dylib|.dll)

name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["workbuddy-v*", "qoderwork-v*", "qwenwork-v*", "traework-v*"]
  workflow_dispatch:
    inputs:
      plugin:
        description: "Plugin to release"
        required: true
        type: choice
        options: [workbuddy, qoderwork, qwenwork, traework]
      version:
        description: "Version without v (empty = plugin's VERSION file)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.dir }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: workbuddy
            node: true
          - dir: qoderwork
            node: false
          - dir: qwenwork
            node: false
          - dir: traework
            node: true
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache-dependency-path: ${{ matrix.dir }}/go.sum
      - uses: actions/setup-node@v7
        if: matrix.node
        with:
          node-version: "22"
      - name: Validate registry.json
        working-directory: .
        run: python3 scripts/validate-registry.py registry.json
      - name: Test
        run: go test -race -count=1 ./...
      - name: Panel tests
        if: matrix.node
        run: node --test panel.test.js
      - name: Vet
        run: go vet ./...

  build:
    name: ${{ matrix.id }} ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # WorkBuddy native
          - id: workbuddy
            goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            ext: so
          - id: workbuddy
            goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: so
          - id: workbuddy
            goos: darwin
            goarch: amd64
            runner: macos-15-intel
            ext: dylib
          - id: workbuddy
            goos: darwin
            goarch: arm64
            runner: macos-15
            ext: dylib
          - id: workbuddy
            goos: windows
            goarch: amd64
            runner: windows-2025
            ext: dll
          # QoderWork native
          - id: qoderwork
            goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            ext: so
          - id: qoderwork
            goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: so
          - id: qoderwork
            goos: darwin
            goarch: amd64
            runner: macos-15-intel
            ext: dylib
          - id: qoderwork
            goos: darwin
            goarch: arm64
            runner: macos-15
            ext: dylib
          - id: qoderwork
            goos: windows
            goarch: amd64
            runner: windows-2025
            ext: dll
          # QwenWork native
          - id: qwenwork
            goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            ext: so
          - id: qwenwork
            goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: so
          - id: qwenwork
            goos: darwin
            goarch: amd64
            runner: macos-15-intel
            ext: dylib
          - id: qwenwork
            goos: darwin
            goarch: arm64
            runner: macos-15
            ext: dylib
          - id: qwenwork
            goos: windows
            goarch: amd64
            runner: windows-2025
            ext: dll
          # TraeWork native
          - id: traework
            goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            ext: so
          - id: traework
            goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: so
          - id: traework
            goos: darwin
            goarch: amd64
            runner: macos-15-intel
            ext: dylib
          - id: traework
            goos: darwin
            goarch: arm64
            runner: macos-15
            ext: dylib
          - id: traework
            goos: windows
            goarch: amd64
            runner: windows-2025
            ext: dll
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.id }}/go.mod
          cache-dependency-path: ${{ matrix.id }}/go.sum

      - name: Resolve release metadata
        working-directory: .
        run: |
          set -euo pipefail
          PLUGIN="${{ matrix.id }}"
          # Version resolution: tag of this plugin > dispatch input > VERSION file
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" == "${PLUGIN}"-v* ]]; then
            VERSION="${GITHUB_REF_NAME#"${PLUGIN}"-v}"
          elif [ -n "${{ github.event.inputs.version }}" ] && [ "${{ github.event.inputs.plugin }}" == "${PLUGIN}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="$(tr -d ' \n\r' < ${PLUGIN}/VERSION)"
            # CI builds (non-release) get a +ci suffix to avoid clashing with real versions
            if [[ "${GITHUB_REF_TYPE:-}" != "tag" && "${{ github.event_name }}" != "workflow_dispatch" ]]; then
              VERSION="${VERSION}+ci.${GITHUB_RUN_NUMBER}"
            fi
          fi
          VERSION="${VERSION#v}"
          CLEAN_VERSION="${VERSION%%+*}"
          {
            echo "VERSION=${CLEAN_VERSION}"
            echo "LIB_NAME=${PLUGIN}.${{ matrix.ext }}"
            echo "ARCHIVE_NAME=${PLUGIN}_${CLEAN_VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          } >> "${GITHUB_ENV}"
          echo "version=${CLEAN_VERSION} archive=${PLUGIN}_${CLEAN_VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"

      - name: Build shared library
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -buildmode=c-shared \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${LIB_NAME}" .
          rm -f "dist/${{ matrix.id }}.h" dist/*.h || true
          file "dist/${LIB_NAME}" || true

      - name: Package plugin (CPA ArchiveName)
        working-directory: .
        run: |
          set -euo pipefail
          go run ./.github/scripts/package-release.go \
            -library "${{ matrix.id }}/dist/${LIB_NAME}" \
            -archive "${ARCHIVE_NAME}" \
            -checksum "${ARCHIVE_NAME}.sha256"
          python3 - <<'PY'
          import zipfile, os, sys
          name = os.environ["ARCHIVE_NAME"]
          lib = os.environ["LIB_NAME"]
          with zipfile.ZipFile(name) as z:
              names = z.namelist()
              print("zip entries:", names)
              if lib not in names:
                  sys.exit(f"zip root missing {lib}: {names}")
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  build-cross:
    name: ${{ matrix.id }} ${{ matrix.target }} (go-cross)
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: workbuddy
            target: windows-arm64
            ext: dll
          - id: workbuddy
            target: freebsd-amd64
            ext: so
          - id: qoderwork
            target: windows-arm64
            ext: dll
          - id: qoderwork
            target: freebsd-amd64
            ext: so
          - id: qwenwork
            target: windows-arm64
            ext: dll
          - id: qwenwork
            target: freebsd-amd64
            ext: so
          - id: traework
            target: windows-arm64
            ext: dll
          - id: traework
            target: freebsd-amd64
            ext: so
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.id }}/go.mod
          cache-dependency-path: ${{ matrix.id }}/go.sum

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          PLUGIN="${{ matrix.id }}"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" == "${PLUGIN}"-v* ]]; then
            VERSION="${GITHUB_REF_NAME#"${PLUGIN}"-v}"
          elif [ -n "${{ github.event.inputs.version }}" ] && [ "${{ github.event.inputs.plugin }}" == "${PLUGIN}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="$(tr -d ' \n\r' < ${PLUGIN}/VERSION)"
          fi
          VERSION="${VERSION#v}"
          CLEAN_VERSION="${VERSION%%+*}"
          GOOS_PART="${{ matrix.target }}"
          {
            echo "VERSION=${CLEAN_VERSION}"
            echo "ARCHIVE_NAME=${PLUGIN}_${CLEAN_VERSION}_${GOOS_PART%-*}_${GOOS_PART#*-}.zip"
            echo "LIB_NAME=${PLUGIN}.${{ matrix.ext }}"
          } >> "${GITHUB_ENV}"
          echo "version=${CLEAN_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build cross shared library (windows-arm64)
        if: matrix.target == 'windows-arm64'
        timeout-minutes: 45
        uses: go-cross/cgo-actions@v1
        env:
          GOFLAGS: -trimpath -buildmode=c-shared
        with:
          dir: ${{ matrix.id }}
          packages: .
          targets: ${{ matrix.target }}
          out-dir: dist/${{ matrix.target }}
          output: ${{ env.LIB_NAME }}
          flags: -ldflags=-s -w
          x-flags: main.version=${{ steps.meta.outputs.version }}

      # go-cross/cgo-actions pins the FreeBSD 14.3 base.txz, which FreeBSD has
      # retired from download.freebsd.org; build against a sysroot fetched at
      # run time instead so the pinned version cannot rot again.
      - name: Build cross shared library (freebsd-amd64)
        if: matrix.target == 'freebsd-amd64'
        timeout-minutes: 45
        env:
          GOFLAGS: -trimpath -buildmode=c-shared
        run: |
          set -euo pipefail
          # Lowest published release: the ELF osreldate tag follows the target
          # triple, and a binary tagged newer than the running kernel is
          # refused, so the oldest sysroot keeps the artifact loadable on
          # every newer FreeBSD.
          SYSROOT_VERSION="$(curl -fsSL --retry 5 --retry-all-errors \
            https://download.freebsd.org/releases/amd64/ \
            | grep -oE '1[0-9]\.[0-9]+-RELEASE' | sort -uV | head -1)"
          if [ -z "${SYSROOT_VERSION}" ]; then
            echo "no FreeBSD release sysroot published"; exit 1
          fi
          echo "FreeBSD sysroot: ${SYSROOT_VERSION}"
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/base.txz \
            "https://download.freebsd.org/releases/amd64/amd64/${SYSROOT_VERSION}/base.txz"
          sudo mkdir -p /opt/freebsd-sysroot
          sudo tar -xf /tmp/base.txz -C /opt/freebsd-sysroot
          rm -f /tmp/base.txz
          command -v ld.lld >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq lld
          }
          mkdir -p "${{ matrix.id }}/dist/${{ matrix.target }}"
          cd "${{ matrix.id }}"
          CGO_ENABLED=1 GOOS=freebsd GOARCH=amd64 \
            CGO_LDFLAGS="-fuse-ld=lld" \
            CC="clang --target=x86_64-unknown-freebsd${SYSROOT_VERSION%-RELEASE} --sysroot=/opt/freebsd-sysroot" \
            go build -o "dist/${{ matrix.target }}/${LIB_NAME}" \
              -ldflags "-s -w -X main.version=${VERSION}"

      - name: Package plugin
        run: |
          set -euo pipefail
          rm -f go-cross-bin.h "${{ matrix.id }}/dist/${{ matrix.target }}/${{ matrix.id }}.h" || true
          LIB=""
          for p in \
            "${{ matrix.id }}/dist/${{ matrix.target }}/${LIB_NAME}" \
            "dist/${{ matrix.target }}/${LIB_NAME}" \
            "${{ matrix.id }}/dist/${LIB_NAME}"; do
            if [ -f "$p" ]; then LIB="$p"; break; fi
          done
          if [ -z "$LIB" ]; then
            echo "library not found"; find . -name '*.dll' -o -name '*.so' | head
            exit 1
          fi
          go run ./.github/scripts/package-release.go \
            -library "${LIB}" \
            -archive "${ARCHIVE_NAME}" \
            -checksum "${ARCHIVE_NAME}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  release:
    name: Release
    # Only for a tag of a specific plugin, or dispatch with a version.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '') ||
      startsWith(github.ref, 'refs/tags/workbuddy-v') ||
      startsWith(github.ref, 'refs/tags/qoderwork-v') ||
      startsWith(github.ref, 'refs/tags/qwenwork-v') ||
      startsWith(github.ref, 'refs/tags/traework-v')
    needs:
      - build
      - build-cross
    runs-on: ubuntu-24.04
    steps:
      # main (not the tag) — registry.json is committed back to main afterwards.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve plugin + version
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            P="${{ github.event.inputs.plugin }}"
            V="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF_NAME}" == workbuddy-v* ]]; then
            P="workbuddy"; V="${GITHUB_REF_NAME#workbuddy-v}"
          elif [[ "${GITHUB_REF_NAME}" == qwenwork-v* ]]; then
            P="qwenwork"; V="${GITHUB_REF_NAME#qwenwork-v}"
          elif [[ "${GITHUB_REF_NAME}" == traework-v* ]]; then
            P="traework"; V="${GITHUB_REF_NAME#traework-v}"
          else
            P="qoderwork"; V="${GITHUB_REF_NAME#qoderwork-v}"
          fi
          case "$P" in
            workbuddy|qoderwork|qwenwork|traework) ;;
            *) echo "unsupported plugin $P"; exit 1 ;;
          esac
          V="${V#v}"
          # Display name for release titles/notes; the plugin id stays lowercase.
          case "$P" in
            workbuddy) NAME="WorkBuddy" ;;
            qoderwork) NAME="QoderWork" ;;
            qwenwork)  NAME="QwenWork" ;;
            traework)  NAME="TraeWork" ;;
          esac
          {
            echo "plugin=$P"
            echo "name=$NAME"
            echo "version=$V"
            echo "tag=${P}-v${V}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $NAME v$V (id $P)"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Assemble checksums.txt (this plugin only)
        env:
          PLUGIN: ${{ steps.meta.outputs.plugin }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          mv dist/"${PLUGIN}_${VERSION}_"*.zip* out/ 2>/dev/null || true
          ls -la out/
          if ls out/*.sha256 >/dev/null 2>&1; then
            sort out/*.sha256 > out/checksums.txt
          else
            (cd out && sha256sum ./*.zip | sed 's|  \./|  |') > out/checksums.txt
          fi
          cat out/checksums.txt
          for t in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64 windows_arm64 freebsd_amd64; do
            test -f "out/${PLUGIN}_${VERSION}_${t}.zip" || { echo "missing ${PLUGIN}_${VERSION}_${t}.zip"; exit 1; }
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          PLUGIN: ${{ steps.meta.outputs.plugin }}
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              git tag -a "${TAG}" -m "Release ${NAME} ${TAG}"
              git push origin "${TAG}"
            fi
          fi
          NOTES=$(cat <<EOF
          ## ${NAME} CPA plugin v${VERSION}

          Multi-arch builds for [CLIProxyAPI](https://github.com/router-for-me/CLIProxyAPI) plugin store (\`direct\` install type).

          ### Assets (pluginstore \`ArchiveName(id, version, goos, goarch)\`)
          | File | Contents |
          |---|---|
          | \`${PLUGIN}_${VERSION}_linux_amd64.zip\` | \`${PLUGIN}.so\` |
          | \`${PLUGIN}_${VERSION}_linux_arm64.zip\` | \`${PLUGIN}.so\` |
          | \`${PLUGIN}_${VERSION}_darwin_amd64.zip\` | \`${PLUGIN}.dylib\` |
          | \`${PLUGIN}_${VERSION}_darwin_arm64.zip\` | \`${PLUGIN}.dylib\` |
          | \`${PLUGIN}_${VERSION}_windows_amd64.zip\` | \`${PLUGIN}.dll\` |
          | \`${PLUGIN}_${VERSION}_windows_arm64.zip\` | \`${PLUGIN}.dll\` |
          | \`${PLUGIN}_${VERSION}_freebsd_amd64.zip\` | \`${PLUGIN}.so\` |
          | \`checksums.txt\` | SHA256 of zips |

          ### Manual install (linux/amd64 example)
          \`\`\`bash
          unzip ${PLUGIN}_${VERSION}_linux_amd64.zip
          cp ${PLUGIN}.so /path/to/cliproxyapi/plugins/${PLUGIN}.so
          \`\`\`

          ### Remote update (custom plugin source)
          \`\`\`
          https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/registry.json
          \`\`\`
          EOF
          )
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" out/"${PLUGIN}_"*.zip out/checksums.txt --clobber --repo "${GITHUB_REPOSITORY}"
          elif ! gh release create "${TAG}" out/"${PLUGIN}_"*.zip out/checksums.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${NAME} v${VERSION}" \
              --notes "${NOTES}"; then
            # A tag push can re-trigger this workflow; the sibling run may have
            # created the release between our check and create. Upload instead.
            gh release upload "${TAG}" out/"${PLUGIN}_"*.zip out/checksums.txt --clobber --repo "${GITHUB_REPOSITORY}"
          fi

      - name: Sync registry.json (direct install plan)
        env:
          PLUGIN: ${{ steps.meta.outputs.plugin }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          python3 .github/scripts/sync-registry.py registry.json "${PLUGIN}" "${VERSION}" out
          python3 scripts/validate-registry.py registry.json
          cat registry.json

      - name: Commit registry.json
        env:
          PLUGIN: ${{ steps.meta.outputs.plugin }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- registry.json; then
            echo "registry.json unchanged"
            exit 0
          fi
          git add registry.json
          git commit -m "chore(registry): publish ${PLUGIN} ${VERSION} direct install plan"
          # Concurrent plugin releases may push first; rebase drops our commit if
          # an identical change already landed, and merges cleanly otherwise.
          for _ in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main || true
          done
          echo "failed to push registry.json after retries"; exit 1

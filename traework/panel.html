<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TraeWork 面板</title>
<style>
/* Theme tokens aligned with the CPA management panel (default light, white,
   dark); an embedded iframe mirrors the parent's data-theme. */
:root{
  --bg:#faf9f5;--card:#ffffff;--border:#e3e1db;--fg:#2d2a26;--mut:#6d6760;
  --acc:#4c8dff;--on-acc:#ffffff;--ok:#10b981;--warn:#e0aa14;--err:#c65746;
  --surface:#f0eee8;--surface-muted:#e9e6df;--btn-sec:#eef1f6;--btn-sec-hover:#e4e8ef;
  --input-bg:#ffffff;--code-bg:#f3f4f6;--code-fg:#374151;--placeholder:rgba(109,103,96,.55);
  --ok-soft:rgba(16,185,129,.10);--ok-border:rgba(16,185,129,.30);
  --warn-soft:rgba(224,170,20,.12);--warn-border:rgba(224,170,20,.32);
  --err-soft:rgba(198,87,70,.10);--err-border:rgba(198,87,70,.30);
  --mut-soft:rgba(109,103,96,.12);--mut-border:rgba(109,103,96,.28);
  --scrim:rgba(45,42,38,.35);--toast-shadow:0 10px 28px rgba(0,0,0,.12),0 0 0 1px rgba(0,0,0,.04);
  --acc-ring:rgba(76,141,255,.18);--radius-md:12px;--radius-lg:16px;
  color-scheme:light
}
:root[data-theme="white"]{
  --bg:#f5f5f5;--card:#ffffff;--border:#e6e6e6;--fg:#1f1f1f;--mut:#707070;
  --surface:#fafafa;--surface-muted:#efefef;--btn-sec:#f0f0f0;--btn-sec-hover:#e8e8e8;
  --input-bg:#ffffff;--code-bg:#f3f4f6;--code-fg:#374151;--placeholder:rgba(112,112,112,.55);
  --scrim:rgba(0,0,0,.32);--toast-shadow:0 10px 28px rgba(0,0,0,.10),0 0 0 1px rgba(0,0,0,.04);
  color-scheme:light
}
:root[data-theme="dark"]{
  --bg:#1e1d1b;--card:#26241f;--border:#3a3833;--fg:#ede9e3;--mut:#9a948c;
  --acc:#4c8dff;--on-acc:#ffffff;--ok:#34d399;--warn:#f0c050;--err:#e07a6a;
  --surface:#2f2d28;--surface-muted:#35332e;--btn-sec:#35332e;--btn-sec-hover:#3f3c36;
  --input-bg:#1e1d1b;--code-bg:#35332e;--code-fg:#d6d1c9;--placeholder:rgba(154,148,140,.55);
  --ok-soft:rgba(52,211,153,.12);--ok-border:rgba(52,211,153,.38);
  --warn-soft:rgba(240,192,80,.14);--warn-border:rgba(240,192,80,.38);
  --err-soft:rgba(224,122,106,.12);--err-border:rgba(224,122,106,.38);
  --mut-soft:rgba(154,148,140,.16);--mut-border:rgba(154,148,140,.32);
  --scrim:rgba(0,0,0,.55);--toast-shadow:0 10px 28px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.03);
  --acc-ring:rgba(76,141,255,.28);
  color-scheme:dark
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--mut);font-size:13px;margin-bottom:20px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
button{background:var(--acc);color:var(--on-acc);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px}
button.sec{background:var(--btn-sec);color:var(--fg)}button.sec:hover{background:var(--btn-sec-hover)}button:disabled{opacity:.5;cursor:default}
button.done{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-border);cursor:default;opacity:1}
button.done:disabled{opacity:1}
.toggle input{width:14px;height:14px;accent-color:var(--acc);cursor:pointer}
.toggle{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card,.summary{background:var(--card);border:1px solid var(--border);border-radius:12px}
.card{padding:16px}
.card h2{font-size:15px;margin:0 0 2px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-badges{display:flex;gap:6px;align-items:center;flex:0 0 auto;white-space:nowrap}
.uid{color:var(--mut);font-size:11px;font-family:ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:12px}
.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-border)}
.badge.warn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-border)}
.badge.err{background:var(--err-soft);color:var(--err);border:1px solid var(--err-border)}
.badge.plain{background:var(--mut-soft);color:var(--mut);border:1px solid var(--mut-border)}
.badge.exhausted{background:var(--err-soft);color:var(--err);border:1px solid var(--err-border)}
.badge.accent{background:var(--acc-ring);color:var(--acc);border:1px solid var(--acc)}
/* 额度条：label 行给可用/已用，track 是当期消耗，meta 补全三个数 */
.pb{display:flex;flex-direction:column;gap:6px;margin:2px 0 4px}
.pb-label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--mut)}
.pb-label>span:first-child{color:var(--fg);font-size:13px;font-weight:600}
.pb-track{height:8px;border-radius:99px;background:var(--mut-soft);overflow:hidden}
.pb-bar{height:100%;border-radius:99px;background:var(--ok);transition:width .25s ease}
.pb-meta{color:var(--mut);font-size:11px;line-height:1.5}
.cgroups{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.cgroup{display:flex;flex-direction:column;gap:4px}
.cg-head{display:flex;align-items:center;gap:8px;font-size:12px}
.cg-name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cg-nums{color:var(--mut);font-family:ui-monospace,monospace;font-size:11px}
.cg-track{height:5px}
.cg-time{color:var(--mut);font-size:11px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.summary{padding:16px;margin-bottom:14px}
.summary-hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.summary-title{font-weight:700;font-size:14px}
.summary-meta{color:var(--mut);font-size:12px}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.summary-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.summary-item .k{color:var(--mut);font-size:11px;margin-bottom:4px}
.summary-item .v{font-size:18px;font-weight:700}
.summary-item .v.ok{color:var(--ok)}
.summary-item .v.warn{color:var(--warn)}
.summary-item .v.err{color:var(--err)}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px dashed var(--border)}
.row:first-of-type{border-top:0}.k{color:var(--mut)}.v{font-weight:600;text-align:right}
.v.ok{color:var(--ok)}.v.warn{color:var(--warn)}.v.err{color:var(--err)}
.pkgs{margin-top:10px;font-size:12px;color:var(--mut);border-top:1px solid var(--border);padding-top:8px;word-break:break-all}
.pkgs.warn{color:var(--warn)}
.login-cell{font-family:ui-monospace,monospace;font-size:11px;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field-input{flex:1;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--fg)}
.field-input::placeholder{color:var(--placeholder)}
.field-input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-ring);outline:none}
.toasts{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:10px;z-index:9999;max-width:360px}
.toast{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--acc);border-radius:var(--radius-md);padding:14px 18px;font-size:13px;box-shadow:var(--toast-shadow);transform:translateX(120%);opacity:0;transition:transform .3s cubic-bezier(.2,.9,.3,1.1),opacity .25s;cursor:pointer;word-break:break-all}
.toast.show{transform:translateX(0);opacity:1}
.toast.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.toast.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.toast.err{border-left-color:var(--err);background:var(--err-soft)}
.toast .t{font-weight:600;margin-bottom:3px}
.toast .d{color:var(--mut);font-size:12px;line-height:1.45}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--on-acc);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.grid-hint{color:var(--mut);text-align:center;padding:40px}
.grid-hint code{background:var(--code-bg);color:var(--code-fg);padding:1px 5px;border-radius:4px;font-size:12px}
.footer{margin-top:18px;text-align:center;color:var(--mut);font-size:12px}
.footer strong{color:var(--fg);font-weight:600}
</style>
<script>
/* Early theme sync (before body paint): mirror the CPA parent's data-theme when
   embedded; standalone falls back to prefers-color-scheme. Same semantics as the
   host's own plugin pages (DOM data-theme is the source of truth). */
(function(){
  var ATTR="data-theme";
  function embedded(){try{return window.self!==window.top}catch(e){return false}}
  function apply(t){
    var el=document.documentElement;
    if(t==="white"||t==="dark")el.setAttribute(ATTR,t);
    else el.removeAttribute(ATTR);
  }
  function parentTheme(){
    if(!embedded())return null;
    try{
      var raw=window.parent.document.documentElement.getAttribute(ATTR);
      if(raw==="white"||raw==="dark")return raw;
      return "light";
    }catch(e){return null}
  }
  function systemTheme(){
    try{return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch(e){return "light"}
  }
  function sync(){apply(parentTheme()||systemTheme())}
  sync();
  window.__twThemeSync=function(){
    sync();
    if(embedded()){
      try{
        var parentEl=window.parent.document.documentElement;
        new MutationObserver(sync).observe(parentEl,{attributes:true,attributeFilter:[ATTR]});
        window.addEventListener("storage",function(e){if(e.key==="cli-proxy-theme")sync()});
      }catch(e){}
      return;
    }
    try{
      var mq=window.matchMedia("(prefers-color-scheme: dark)");
      var on=function(){sync()};
      if(mq.addEventListener)mq.addEventListener("change",on);
      else if(mq.addListener)mq.addListener(on);
    }catch(e){}
  };
})();
</script>
</head>
<body>
<div class="wrap">
  <h1>TraeWork 账号面板</h1>
  <div class="sub">浏览器授权登录 · 设备证明刷新令牌 · solo 通道对话（模型目录按账号下发）</div>
  <div id="authBox" class="card" style="display:none;margin-bottom:16px">
    <div id="authHint" style="margin-bottom:8px;color:var(--mut)">需要管理密钥（management key）才能读取账号数据。从 CPA 主面板嵌入时会自动获取，无需输入。</div>
    <div style="display:flex;gap:8px">
      <input id="keyInput" type="password" placeholder="management key" class="field-input" autocomplete="off">
      <button onclick="saveKey()">连接</button>
    </div>
  </div>
  <div class="bar">
    <button id="reload" onclick="load(true,this)">刷新数据</button>
    <button id="checkinAll" class="sec" onclick="checkinAll(this)">全部签到</button>
    <label class="toggle" title="每天 09:00 / 21:00 各领一次（晚上那趟补早上赶上繁忙的账号）"><input type="checkbox" id="autoToggle" onchange="toggleAuto(this.checked)"> 自动签到</label>
    <span class="toggle" id="svtime"></span>
  </div>
  <div class="card" id="loginBox" style="margin-bottom:14px">
    <div class="summary-hd" style="margin-bottom:10px">
      <span class="summary-title">登录 TraeWork</span>
      <span class="summary-meta" id="loginMeta"></span>
    </div>
    <div id="loginIdle">
      <div class="sub" style="margin-bottom:10px">点「开始登录」后到浏览器里完成授权。浏览器与网关同机时授权码自动回传；不在同一台机器时，把授权后地址栏里的完整 URL 粘贴到下方输入框。</div>
      <button id="loginStart" onclick="startLogin(this)">开始登录</button>
    </div>
    <div id="loginPending" style="display:none">
      <div class="bar" style="margin-bottom:10px">
        <button id="loginOpen" onclick="openAuthorize()">打开授权页面</button>
        <button id="loginCopy" class="sec" onclick="copyAuthorize()">复制授权链接</button>
        <button class="sec" onclick="cancelLogin(this)">取消</button>
      </div>
      <div class="row"><span class="k">回调地址</span><span class="v login-cell" id="loginCallback"></span></div>
      <div class="row"><span class="k">授权链接</span><span class="v login-cell" id="loginUrl"></span></div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <input id="loginInput" class="field-input" placeholder="粘贴回调 URL（或其中的 AuthCode）" autocomplete="off" onkeydown="if(event.key===&quot;Enter&quot;)submitCallback()">
        <button id="loginSubmit" onclick="submitCallback(this)">提交</button>
      </div>
      <div class="pkgs" id="loginStatus"></div>
    </div>
    <div id="loginDone" style="display:none">
      <div class="pkgs" id="loginDoneMsg"></div>
    </div>
  </div>
  <div class="summary card" id="summaryBox" style="display:none"></div>
  <div id="accounts" class="grid"><div class="grid-hint">加载中…</div></div>
  <footer class="footer">登录在本面板发起；账号与令牌由 CPA 宿主保存，插件只读展示。</footer>
</div>
<div class="toasts" id="toasts"></div>
<script>
const MANAGEMENT_BASE_PATH=__TW_MANAGEMENT_BASE_PATH_JSON__;
const API=MANAGEMENT_BASE_PATH+"/plugins/traework";

/* ---------- management key acquisition ----------
   1) ?key= URL param (kept in sessionStorage, scrubbed from the address bar).
   2) sessionStorage from an earlier visit or a manual entry.
   3) the CPA main panel's localStorage "cli-proxy-auth" (XOR+base64,
      same-origin iframe embed) — the approach the host's own plugin pages use. */
const ENC_PREFIX = "enc::v1::";
const SECRET_SALT = "cli-proxy-api-webui::secure-storage";
const PANEL_STORE = "cli-proxy-auth";
const SS_KEY = "traework-mgmt-key";
let sessionKeySuppressed = false;

function readSessionKey(){if(sessionKeySuppressed)return null;try{return sessionStorage.getItem(SS_KEY)}catch(_){return null}}
function storeSessionKey(key){try{sessionStorage.setItem(SS_KEY,key);sessionKeySuppressed=false;return true}catch(_){return false}}
function clearSessionKey(){sessionKeySuppressed=true;try{sessionStorage.removeItem(SS_KEY)}catch(_){}}
function _enc(t){return new TextEncoder().encode(t)}
function _dec(b){return new TextDecoder().decode(b)}
function _keyBytes(){try{return _enc(SECRET_SALT+"|"+window.location.host+"|"+navigator.userAgent)}catch(e){return _enc(SECRET_SALT)}}
function _xor(d,k){const r=new Uint8Array(d.length);for(let i=0;i<d.length;i++)r[i]=d[i]^k[i%k.length];return r}
function _b64d(s){const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b}
function deobfuscate(p){if(!p||!p.startsWith(ENC_PREFIX))return p;try{return _dec(_xor(_b64d(p.slice(ENC_PREFIX.length)),_keyBytes()))}catch(e){return p}}
function isEmbedded(){try{return window.self!==window.top}catch(e){return false}}

function readPanelKey(){
  if(!isEmbedded())return null;
  let raw;try{raw=localStorage.getItem(PANEL_STORE)}catch(e){return null}
  if(!raw)return null;
  try{
    const parsed=JSON.parse(deobfuscate(raw));
    const st=(parsed&&parsed.state)||parsed||{};
    return typeof st.managementKey==="string"&&st.managementKey?st.managementKey:null;
  }catch(e){return null}
}
function captureUrlKey(){
  let url;try{url=new URL(window.location.href)}catch(e){return}
  const key=url.searchParams.get("key");
  if(!key)return;
  try{if(!storeSessionKey(key))clearSessionKey()}finally{
    url.searchParams.delete("key");
    try{history.replaceState(null,"",url.pathname+url.search+url.hash)}catch(e){}
  }
}
captureUrlKey();
function getKey(){
  if(sessionKeySuppressed)return null;
  return readSessionKey()||readPanelKey();
}
function authHeaders(key){return key?{"Authorization":"Bearer "+key}:{}}

/* 宿主会对插件管理接口 JSON 响应里的每个字符串做 HTML 转义（防 XSS），所以
   面板拿到值后必须先解回来：授权链接里的 & 会变成 &amp;，直接拿去打开或复制就是
   一条坏链接。转义发生在插件之后，插件侧解不了，只能在这里解。 */
function decodeEntities(value){
  if(typeof value!=="string"||value.indexOf("&")<0)return value;
  return value.replace(/&(amp|lt|gt|quot|apos);/g,function(all,name){
    if(name==="amp")return "&";
    if(name==="lt")return "<";
    if(name==="gt")return ">";
    if(name==="quot")return '"';
    return "'";
  }).replace(/&#(\d+);/g,function(all,code){
    try{return String.fromCodePoint(parseInt(code,10))}catch(e){return all}
  });
}
function deepDecode(value){
  if(typeof value==="string")return decodeEntities(value);
  if(Array.isArray(value))return value.map(deepDecode);
  if(value&&typeof value==="object"){
    const out={};
    for(const key in value)out[key]=deepDecode(value[key]);
    return out;
  }
  return value;
}

async function api(path,options){
  const key=getKey();
  const url=new URL(API+path,location.origin);
  const opts=Object.assign({credentials:"omit",headers:authHeaders(key)},options||{});
  if(opts.body&&typeof opts.body!=="string"){
    opts.headers=Object.assign({},opts.headers,{"Content-Type":"application/json"});
    opts.body=JSON.stringify(opts.body);
  }
  const res=await fetch(url,opts);
  const body=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(body.error||("HTTP "+res.status));
  if(body&&body.error)throw new Error(body.error);
  return deepDecode(body);
}

function showAuth(message){
  const box=document.getElementById("authBox");
  if(!box)return;
  if(message){
    const hint=document.getElementById("authHint");
    if(hint)hint.textContent=message;
  }
  box.style.display="block";
  const input=document.getElementById("keyInput");
  if(input)input.focus();
}
function saveKey(){
  const input=document.getElementById("keyInput");
  const value=((input&&input.value)||"").trim();
  if(!value)return;
  if(!storeSessionKey(value)){showAuth("浏览器拒绝了会话存储，请改用地址栏的 ?key= 方式。");return}
  document.getElementById("authBox").style.display="none";
  load(true);
}

/* 右上角滑入通知栈 */
function toast(title, kind, detail){
  const box=document.getElementById("toasts");
  if(!box)return;
  const el=document.createElement("div");
  el.className="toast "+(kind||"ok");
  el.innerHTML='<div class="t"></div>'+(detail?'<div class="d"></div>':'');
  el.querySelector(".t").textContent=title;
  if(detail)el.querySelector(".d").textContent=detail;
  box.appendChild(el);
  requestAnimationFrame(function(){requestAnimationFrame(function(){el.classList.add("show")})});
  const hide=function(){el.classList.remove("show");setTimeout(function(){el.remove()},300)};
  el.addEventListener("click",hide);
  setTimeout(hide,6000);
}

function esc(value){
  return String(value==null?"":value).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function regionBadge(region){
  const value=String(region||"").toUpperCase();
  if(!value)return "";
  return '<span class="badge '+(value==="CN"?"":"warn")+'">'+value+'</span>';
}
const PLAN_LABELS={free:"免费版",pro:"专业版","pro+":"专业版+"};
function planLabel(identity){
  const raw=String(identity||"");
  if(!raw)return "";
  return PLAN_LABELS[raw.toLowerCase()]||raw;
}
// 卡片只讲额度：认证状态（令牌、到期、文件）归 CPA 的认证文件模块，这里不再重复。
function accountBadges(a){
  const cr=a.credits||{};
  // 「耗尽」只在确实报了额度池时才说：池未知时 remain 为 0 不代表没额度。
  const exhausted=!a.disabled&&!!a.credits&&(cr.total_remain||0)<=0&&(cr.total_size||0)>0;
  const plan=planLabel(cr.identity);
  return (a.disabled?'<span class="badge plain">已停用</span>':"")+
    (exhausted?'<span class="badge exhausted">额度耗尽</span>':"")+
    (cr.billing?'<span class="badge accent">'+esc(cr.billing)+'</span>':"")+
    (plan?'<span class="badge">'+esc(plan)+'</span>':"");
}
function num(value){
  const n=Number(value||0);
  return Number.isInteger(n)?String(n):n.toFixed(2);
}
function progressHTML(cr,state){
  // state: "loading" | "disabled" | "error" | ""
  if(state==="disabled"){
    return '<div class="pb"><div class="pb-label"><span>可用积分</span><span>-</span></div>'+
      '<div class="pb-track"><div class="pb-bar" style="width:0%"></div></div></div>';
  }
  if(!cr||state==="loading"){
    return '<div class="pb"><div class="pb-label"><span>可用积分</span><span>加载中…</span></div>'+
      '<div class="pb-track"><div class="pb-bar" style="width:0%"></div></div></div>';
  }
  const remain=cr.total_remain||0, used=cr.total_used||0;
  const total=cr.total_size>0?cr.total_size:(remain+used);
  const exhausted=remain<=0&&cr.total_size>0;
  const pct=total>0?Math.round(used/total*100):(exhausted?100:0);
  let color="var(--ok)"; if(pct>60)color="var(--warn)"; if(pct>85||exhausted)color="var(--err)";
  const right=exhausted?'<span style="color:var(--err)">已耗尽</span>':("已用 "+num(used)+" · "+pct+"%");
  const when=cr.fetched_at?(" · 快照 "+cr.fetched_at.replace("T"," ").replace("Z"," UTC")):"";
  return '<div class="pb"><div class="pb-label"><span>可用 '+num(remain)+'</span><span>'+right+'</span></div>'+
    '<div class="pb-track"><div class="pb-bar" style="width:'+pct+'%;background:'+color+'"></div></div>'+
    '<div class="pb-meta">剩余 '+num(remain)+' · 已用 '+num(used)+' · 额度池 '+num(total)+
      (cr.pack_count?(" · "+cr.pack_count+" 个包"):"")+when+'</div>'+
    packsHTML(cr.packs)+'</div>';
}
function packsHTML(packs){
  if(!packs||!packs.length)return "";
  return '<div class="cgroups">'+packs.map(function(pk){
    const total=Number(pk.limit||0), used=Number(pk.used||0);
    const pct=total>0?Math.round(used/total*100):0;
    let color="var(--ok)"; if(pct>60)color="var(--warn)"; if(pct>85||(total>0&&used>=total))color="var(--err)";
    const bar=total>0?'<div class="pb-track cg-track"><div class="pb-bar" style="width:'+pct+'%;background:'+color+'"></div></div>':"";
    return '<div class="cgroup"><div class="cg-head"><span class="cg-name">'+esc(pk.name)+'</span>'+
      '<span class="cg-nums">已用 '+num(used)+(total>0?(" / "+num(total)):"")+'</span></div>'+bar+
      (pk.expires?'<div class="cg-time">至 '+esc(pk.expires)+'</div>':"")+'</div>';
  }).join("")+'</div>';
}
function checkinText(ci){
  if(!ci)return "";
  if(!ci.enabled)return "未开放";
  if(ci.today_checked_in)return "今日已签到";
  const amount=(ci.credits||0)+(ci.extra_credits||0);
  return amount>0?("今日未签到 · 可领 "+amount):"今日未签到";
}
// 卡片内容一次性重绘：额度回填时原地替换 innerHTML，节点身份不变（引用它的地方
// 和测试都还指得着）。
function fillCard(el,a){
  const state=a.disabled?"disabled":(a.credits?"":"loading");
  el.className="card";
  el.innerHTML='<h2><span class="card-name"></span><span class="card-badges">'+accountBadges(a)+'</span></h2>'+
    progressHTML(a.credits,state)+
    (a.checkin?'<div class="row"><span class="k">签到</span><span class="v"></span></div>':"")+
    (a.note?'<div class="pkgs warn"></div>':"")+
    '<div class="actions">'+
      (canCheckin(a)?'<button class="'+(a.checkin.today_checked_in?"done":"")+'" data-action="checkin"'+(a.checkin.today_checked_in?' disabled="disabled"':"")+'>'+(a.checkin.today_checked_in?"已签到":"签到")+'</button>':"")+
      '<button class="sec" data-action="refresh"'+(a.disabled?" disabled":"")+'>刷新额度</button>'+
    '</div>';
  el.querySelector(".card-name").textContent=a.label||"TraeWork";
  const checkinValue=el.querySelector(".row .v");
  if(checkinValue)checkinValue.textContent=checkinText(a.checkin);
  if(a.note){
    const note=el.querySelector(".pkgs");
    if(note)note.textContent=a.note;
  }
  rememberCard(a.auth_index,el);
  const refreshBtn=el.querySelector("[data-action=refresh]");
  if(refreshBtn&&!a.disabled)refreshBtn.addEventListener("click",function(){refreshCredits(a.auth_index||"",el,refreshBtn,true)});
  const checkinBtn=el.querySelector("[data-action=checkin]");
  if(checkinBtn)checkinBtn.addEventListener("click",function(){checkinOne(checkinBtn,a.auth_index||"")});
  return el;
}
function accountCard(a){
  const el=document.createElement("article");
  el.setAttribute("data-auth",a.auth_index||"");
  return fillCard(el,a);
}

// 有签到活动就给按钮：今天已领的显示成禁用的「已签到」，让人一眼看出领过了。
function canCheckin(a){
  return !!(a&&a.checkin&&a.checkin.enabled&&!a.disabled);
}
function checkinSummaryText(summary){
  const parts=[];
  if(summary.claimed)parts.push("成功 "+summary.claimed);
  if(summary.already)parts.push("今日已领 "+summary.already);
  if(summary.busy)parts.push("上游繁忙待重试 "+summary.busy);
  if(summary.fail)parts.push("失败 "+summary.fail);
  return parts.join(" · ")||"没有需要领取的账号";
}
// 单账号签到：上游 9074 是「人太多，稍后再试」，属于可重试，不当失败报。
async function checkinOne(btn,authIndex){
  if(!getKey()||!authIndex)return;
  if(btn)btn.disabled=true;
  try{
    const payload=await api("/checkin",{method:"POST",body:{auth_index:authIndex}});
    const out=(payload.results||[])[0]||{};
    const done=out.success===true||out.already===true;
    toast(done?(out.already?"今日已签到":"签到成功"):"签到未完成",done?"ok":(out.retryable?"warn":"err"),out.message||"");
    await refreshCredits(authIndex,cardNodes.get(String(authIndex)),null,true);
  }catch(err){
    toast("签到失败","err",String((err&&err.message)||err));
    if(btn)btn.disabled=false;
  }
}
async function checkinAll(btn){
  if(!getKey())return;
  if(btn)btn.disabled=true;
  try{
    const payload=await api("/checkin",{method:"POST",body:{}});
    const summary=payload.summary||{};
    toast("全部签到",summary.fail?"warn":"ok",checkinSummaryText(summary));
    await load(false);
  }catch(err){
    toast("签到失败","err",String((err&&err.message)||err));
  }finally{
    if(btn)btn.disabled=false;
  }
}
// 自动签到开关：宿主没有回写插件配置的回调，所以只在本次运行内生效。
async function toggleAuto(on){
  if(!getKey())return;
  try{
    const payload=await api("/checkin/config",{method:"POST",body:{enabled:!!on}});
    toast("自动签到已"+(payload.checkin_auto?"开启":"关闭"),"ok",payload.persistent===false?"本次运行生效；重启后以插件配置 checkin_auto 为准":"");
  }catch(err){
    toast("设置失败","err",String((err&&err.message)||err));
  }
}

function renderSummary(accounts){
  const box=document.getElementById("summaryBox");
  if(!box)return;
  let remain=0,used=0,size=0,unknown=0,pending=0;
  accounts.forEach(function(a){
    if(!a.credits){unknown++;return}
    remain+=Number(a.credits.total_remain||0);
    used+=Number(a.credits.total_used||0);
    size+=Number(a.credits.total_size||0);
    if(a.checkin&&a.checkin.enabled&&!a.checkin.today_checked_in)pending++;
  });
  box.innerHTML='<div class="summary-hd"><span class="summary-title">额度概览</span>'+
    '<span class="summary-meta">solo 通道 · 额度随账号下发</span></div>'+
    '<div class="summary-grid">'+
      '<div class="summary-item"><div class="k">账号总数</div><div class="v">'+accounts.length+'</div></div>'+
      '<div class="summary-item"><div class="k">可用积分</div><div class="v ok">'+num(remain)+'</div></div>'+
      '<div class="summary-item"><div class="k">已用</div><div class="v">'+num(used)+'</div></div>'+
      '<div class="summary-item"><div class="k">额度池</div><div class="v">'+num(size||remain+used)+'</div></div>'+
      '<div class="summary-item"><div class="k">未签到</div><div class="v '+(pending?"warn":"")+'">'+pending+'</div></div>'+
    '</div>'+
    (unknown?('<div class="summary-meta">'+unknown+' 个账号额度尚未读取</div>'):"");
  box.style.display=accounts.length?"block":"none";
}

// 每张卡自己拉额度：/accounts 只回缓存，列表因此永远是一次往返。
// auth_index → 卡片节点：额度回填是原地替换卡片，不靠选择器反查。
const cardNodes=new Map();
function rememberCard(authIndex,node){
  if(authIndex)cardNodes.set(String(authIndex),node);
}
// 每张卡自己拉额度：/accounts 只带缓存快照，列表因此永远是一次往返；点「刷新额度」
// 才绕过缓存直连上游。
function lazyLoadCredits(accounts){
  accounts.filter(function(a){return !a.disabled&&a.auth_index&&!a.credits}).forEach(function(a){
    const card=cardNodes.get(String(a.auth_index));
    if(card)refreshCredits(a.auth_index,card,null,false);
  });
}
async function refreshCredits(authIndex,card,btn,fresh){
  if(!getKey()||!authIndex)return;
  if(btn)btn.disabled=true;
  const pb=card&&card.querySelector(".pb");
  if(pb)pb.outerHTML=progressHTML(null,"loading");
  try{
    const payload=await api("/credits?auth_index="+encodeURIComponent(authIndex)+(fresh?"&fresh=1":""));
    applyCredits(authIndex,payload);
  }catch(err){
    const failed=card&&card.querySelector(".pb");
    if(failed)failed.outerHTML='<div class="pb"><div class="pb-label"><span>可用积分</span><span>读取失败</span></div>'+
      '<div class="pb-track"><div class="pb-bar" style="width:0%"></div></div>'+
      '<div class="pb-meta">'+esc(String((err&&err.message)||err))+'</div></div>';
  }finally{
    if(btn)btn.disabled=false;
  }
}
// 评论卡原地刷新：把新快照写回 data 缓存，再重建卡片，避免整页重载。
let lastAccounts=[];
function applyCredits(authIndex,payload){
  const account=lastAccounts.filter(function(a){return a.auth_index===authIndex})[0];
  if(!account)return;
  account.credits=payload.credits||null;
  account.checkin=payload.checkin||null;
  const card=cardNodes.get(String(authIndex));
  if(!card)return;
  fillCard(card,account);
  renderSummary(lastAccounts);
}

async function load(showToast,btn){
  const list=document.getElementById("accounts");
  const svtime=document.getElementById("svtime");
  if(btn)btn.disabled=true;
  try{
    if(!getKey()){
      // 无密钥时不发请求：宿主对空密钥同样记一次失败尝试，连点会把这个 IP 封 30 分钟。
      list.replaceChildren();
      const hint=document.createElement("div");
      hint.className="grid-hint";
      hint.textContent="需要管理密钥（management key）才能读取账号数据。";
      list.append(hint);
      renderSummary([]);
      if(svtime)svtime.textContent="";
      showAuth("需要管理密钥（management key）才能读取账号数据。从 CPA 主面板嵌入时会自动获取，无需输入。");
      return;
    }
    const data=await api("/accounts");
    const accounts=data.accounts||[];
    list.replaceChildren();
    if(!accounts.length){
      const hint=document.createElement("div");
      hint.className="grid-hint";
      hint.innerHTML='还没有账号。点上方「开始登录」完成 TraeWork 授权后，账号会出现在这里。';
      list.append(hint);
    }else{
      accounts.forEach(function(a){list.append(accountCard(a))});
      lazyLoadCredits(accounts);
    }
    lastAccounts=accounts;
    const autoToggle=document.getElementById("autoToggle");
    if(autoToggle)autoToggle.checked=!!data.checkin_auto;
    renderSummary(accounts);
    if(svtime)svtime.textContent="共 "+accounts.length+" 个账号 · 更新于 "+new Date().toLocaleTimeString("zh-CN",{hour12:false});
    if(showToast)toast("已刷新","ok",accounts.length+" 个账号");
  }catch(err){
    list.replaceChildren();
    const hint=document.createElement("div");
    hint.className="grid-hint";
    const message=String((err&&err.message)||err);
    hint.textContent="读取失败："+message;
    list.append(hint);
    renderSummary([]);
    if(svtime)svtime.textContent="";
    toast("读取失败","err",message);
    if(message.indexOf("management key")>=0||message==="unauthorized"){
      showAuth("需要管理密钥（management key）才能读取账号数据。从 CPA 主面板嵌入时会自动获取，无需输入。");
    }
  }finally{
    if(btn)btn.disabled=false;
  }
}

/* ---------- 登录：面板是唯一入口（授权 + 收码） ----------
   账户登录只有一条交付路径：TraeWork 授权页把授权码交回浏览器。浏览器能到插件
   的回环口就自动完成；到不了就把授权后地址栏的 URL 粘回来。CPA 那边的回调框认
   不了这种回跳（它只解析 code+state），所以登录入口统一在这里。 */
const LOGIN_POLL_MS=2000;
let loginState=null,loginTimer=null,loginAuthorize="";

function loginView(view){
  const idle=document.getElementById("loginIdle");
  const pending=document.getElementById("loginPending");
  const done=document.getElementById("loginDone");
  if(idle)idle.style.display=view==="idle"?"block":"none";
  if(pending)pending.style.display=view==="pending"?"block":"none";
  if(done)done.style.display=view==="done"?"block":"none";
}
function loginSetStatus(message,kind){
  const el=document.getElementById("loginStatus");
  if(!el)return;
  el.textContent=message||"";
  el.className="pkgs"+(kind==="warn"?" warn":"");
}
function loginSetMeta(text,kind){
  const el=document.getElementById("loginMeta");
  if(!el)return;
  el.textContent=text||"";
  el.className=kind==="ok"?"badge":(kind==="err"?"badge err":(kind==="warn"?"badge warn":"badge plain"));
}
function loginStopPolling(){if(loginTimer){clearInterval(loginTimer);loginTimer=null}}
function loginFocusPaste(){
  const input=document.getElementById("loginInput");
  if(!input)return;
  try{input.focus()}catch(_){}
}
// 粘贴完就自动提交：这一步本来就要人工复制一次，别让人再点一次按钮。
function loginBindPaste(){
  const input=document.getElementById("loginInput");
  if(!input||!input.addEventListener)return;
  input.addEventListener("paste",function(){
    setTimeout(function(){
      if(!loginState)return;
      if(!((input.value||"").trim()))return;
      submitCallback();
    },150);
  });
}
function requiresKey(){
  if(getKey())return false;
  // 无密钥一律不发请求：宿主把空密钥也算一次失败尝试，连点会把这个 IP 封 30 分钟。
  showAuth("需要管理密钥（management key）才能登录。从 CPA 主面板嵌入时会自动获取，无需输入。");
  toast("需要管理密钥","warn","从 CPA 主面板嵌入时会自动获取，无需输入");
  return true;
}

function renderLogin(payload){
  if(!payload)return;
  if(payload.authorize_url)loginAuthorize=payload.authorize_url;
  const callback=document.getElementById("loginCallback");
  const link=document.getElementById("loginUrl");
  const callbackURL=payload.callback_url||(payload.callback_port?("http://127.0.0.1:"+payload.callback_port+"/authorize"):"");
  if(callback){
    callback.textContent=callbackURL||"—";
    callback.title=callbackURL||"";
  }
  if(link){
    link.textContent=loginAuthorize||"—";
    link.title=loginAuthorize||"";
  }
  if(payload.status==="success"){
    loginStopPolling();
    loginView("done");
    const done=document.getElementById("loginDoneMsg");
    if(done)done.textContent=(payload.message||"登录成功")+(payload.label?" · "+payload.label:"")+(payload.file_name?" · "+payload.file_name:"");
    loginSetMeta("已完成","ok");
    loginState=null;
    toast("登录成功","ok",payload.label||"");
    load(false);
    return;
  }
  if(payload.status==="error"){
    loginStopPolling();
    loginSetStatus(payload.message||"登录失败","warn");
    loginSetMeta("失败","err");
    return;
  }
  loginSetStatus(payload.message||"等待授权…","");
  loginSetMeta("进行中","plain");
}

async function startLogin(btn){
  if(requiresKey())return;
  if(btn)btn.disabled=true;
  try{
    // 先接管可能已存在的尝试：CPA 弹窗点登录时那次尝试的授权码只能由它自己兑换。
    if(await adoptExistingLogin())return;
    const payload=await api("/login/start",{method:"POST",body:{}});
    loginState=payload.state;
    loginAuthorize=payload.authorize_url||"";
    loginView("pending");
    renderLogin(payload);
    loginStopPolling();
    loginTimer=setInterval(pollLogin,LOGIN_POLL_MS);
    loginFocusPaste();
    if(loginAuthorize)window.open(loginAuthorize,"_blank");
  }catch(err){
    toast("发起登录失败","err",String((err&&err.message)||err));
  }finally{
    if(btn)btn.disabled=false;
  }
}

async function pollLogin(){
  if(!loginState)return;
  if(!getKey()){loginStopPolling();return}
  try{
    renderLogin(await api("/login/status?state="+encodeURIComponent(loginState)));
  }catch(err){
    loginStopPolling();
    loginSetStatus(String((err&&err.message)||err),"warn");
  }
}

async function submitCallback(btn){
  if(requiresKey())return;
  if(!loginState){toast("登录会话已失效","warn","请重新点「开始登录」");loginView("idle");return}
  const input=document.getElementById("loginInput");
  const value=((input&&input.value)||"").trim();
  if(!value){loginSetStatus("请先粘贴回调 URL 或 AuthCode","warn");return}
  if(btn)btn.disabled=true;
  try{
    const payload=await api("/login/callback",{method:"POST",body:{state:loginState,input:value}});
    if(input)input.value="";
    renderLogin(payload);
  }catch(err){
    loginSetStatus(String((err&&err.message)||err),"warn");
  }finally{
    if(btn)btn.disabled=false;
  }
}

async function cancelLogin(btn){
  if(btn)btn.disabled=true;
  try{
    if(loginState&&getKey())await api("/login/cancel",{method:"POST",body:{state:loginState}});
  }catch(_){
  }finally{
    loginStopPolling();
    loginState=null;
    loginAuthorize="";
    loginView("idle");
    loginSetMeta("");
    loginSetStatus("","");
    if(btn)btn.disabled=false;
  }
}

async function copyAuthorize(){
  if(!loginAuthorize){loginSetStatus("授权链接还没准备好，请稍后重试","warn");return}
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      await navigator.clipboard.writeText(loginAuthorize);
      toast("授权链接已复制","ok","");
      return;
    }
  }catch(_){
  }
  loginSetStatus("浏览器不允许自动复制，请选中「授权链接」手动复制","warn");
}

function openAuthorize(){
  if(loginAuthorize)window.open(loginAuthorize,"_blank");
  else loginSetStatus("授权链接还没准备好，请稍后重试","warn");
}

// 面板不另开登录：CPA 弹窗点登录时已经有一次进行中的尝试，授权码是绑定那次尝试
// 的 PKCE verifier 的，粘贴必须落到它身上。地址栏带 ?login=<state> 时优先认它，
// 否则取服务端当前仍在等的那个。
async function adoptExistingLogin(){
  if(!getKey())return false;
  let state=null;
  try{state=new URL(window.location.href).searchParams.get("login")}catch(e){state=null}
  try{
    const payload=state
      ? await api("/login/status?state="+encodeURIComponent(state))
      : await api("/login/current");
    if(!payload||!payload.state||payload.status==="none"||payload.status==="error")return false;
    loginState=payload.state;
    loginAuthorize=payload.authorize_url||"";
    loginView("pending");
    renderLogin(payload);
    loginStopPolling();
    loginTimer=setInterval(pollLogin,LOGIN_POLL_MS);
    loginFocusPaste();
    return true;
  }catch(_){
    return false;
  }
}
async function adoptLoginParam(){
  if(await adoptExistingLogin())return;
  loginView("idle");
}

loginBindPaste();
if(window.__twThemeSync)window.__twThemeSync();
adoptLoginParam();
load(false);
</script>
</body>
</html>
